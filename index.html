<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shred – 8-week meal plan</title>
<meta name="theme-color" content="#2E6A4C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shred">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4EF; --surface:#FFFFFF; --sunk:#E8ECE6; --ink:#1C2620; --muted:#5B685F; --line:#D5DCD4;
  --herb:#2E6A4C; --herb-ink:#FFFFFF; --herb-soft:#DCEBE2;
  --protein:#3657A6; --carbs:#7E5A08; --fat:#8B4F9C; --over:#B8432C;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111714; --surface:#1A221D; --sunk:#222C26; --ink:#E6ECE7; --muted:#9BA8A0; --line:#2E3A33;
    --herb:#73C49A; --herb-ink:#0D1A13; --herb-soft:#1F3328;
    --protein:#93ABF2; --carbs:#E6BB55; --fat:#CF9ADB; --over:#F08A73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111714; --surface:#1A221D; --sunk:#222C26; --ink:#E6ECE7; --muted:#9BA8A0; --line:#2E3A33;
  --herb:#73C49A; --herb-ink:#0D1A13; --herb-soft:#1F3328;
  --protein:#93ABF2; --carbs:#E6BB55; --fat:#CF9ADB; --over:#F08A73;
  color-scheme: dark;
}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--herb);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 120px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding:12px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-0.02em}
.weekpill{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted)}
.weekpill b{color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--herb);font-weight:700}

h1,h2,h3{font-family:var(--display);letter-spacing:-0.015em;margin:0}
h2{font-size:24px;font-weight:800;line-height:1.15}
h3{font-size:18px;font-weight:700}
.sub{color:var(--muted);font-size:15px}
section.view{padding-top:18px}
[hidden]{display:none !important}

/* day strip */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .d{font-size:12px;color:var(--muted)}
.day .n{font-family:var(--display);font-weight:700;font-size:18px}
.day .dot{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.day.done .dot{background:var(--herb)}
.day.part .dot{background:var(--line)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day[aria-pressed="true"] .d{color:inherit;opacity:.75}
.day.today:not([aria-pressed="true"]){border-color:var(--herb);border-width:2px}

/* macro meters */
.meters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;margin-bottom:18px}
.meter{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;padding:5px 0}
.meter .lab{font-size:14px;font-weight:700}
.meter .val{font-size:14px;color:var(--muted);text-align:right;min-width:92px}
.meter .val b{color:var(--ink)}
.bar{position:relative;height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .35s ease}
.meters .foot{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}

/* meals */
.meal{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 16px;margin-bottom:10px}
.meal .slot{font-size:13px;color:var(--muted)}
.meal .nm{background:none;border:0;padding:0;text-align:left;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.mac{font-size:13.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.mac span b{font-weight:700}
.p{color:var(--protein)} .c{color:var(--carbs)} .f{color:var(--fat)}
.tick{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .2s,border-color .2s}
.tick svg{width:22px;height:22px;opacity:.25}
.tick[aria-pressed="true"]{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.tick[aria-pressed="true"] svg{opacity:1}
.meal.eaten{background:var(--herb-soft);border-color:transparent}

/* recipe list */
.rlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.rcard{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rcard .t{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25}
.rcard .w{font-size:13.5px;color:var(--muted);margin-top:2px}
.rcard .k{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.rcard .k small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px;display:block;text-align:right}
.group-h{margin:22px 0 4px;font-size:15px;color:var(--muted);font-weight:700}

/* recipe detail */
.back{background:none;border:0;padding:6px 0;display:inline-flex;align-items:center;gap:6px;color:var(--herb);font-weight:700}
.rhead{margin:8px 0 6px}
.rmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:6px}
.adapt{font-size:14px;color:var(--muted);border-left:3px solid var(--herb);padding:2px 0 2px 10px;margin:12px 0 0}
.scale{margin:18px 0 16px;background:var(--ink);color:var(--paper);border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.scale .lab{font-size:14px;opacity:.75;line-height:1.3}
.scale .lab b{display:block;opacity:1;font-size:15px}
.scale .big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;text-align:center;letter-spacing:-0.03em}
.scale .big small{display:block;font-family:var(--body);font-weight:400;font-size:13px;opacity:.7;letter-spacing:0;margin-top:4px}
.scale .ctr{display:flex;gap:8px}
.scale button{width:48px;height:48px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--paper) 35%,transparent);background:transparent;color:var(--paper);font-size:26px;line-height:1;display:grid;place-items:center}
.scale button:disabled{opacity:.3}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.ings{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ing{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing .in1{font-weight:700;font-size:15.5px;line-height:1.3}
.ing .in2{font-size:13px;color:var(--muted);margin-top:2px}
.ing .q{font-family:var(--display);font-weight:700;font-size:20px;text-align:right;white-space:nowrap}
.ing .q small{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.tot b{display:block;font-family:var(--display);font-size:20px}
.tot span{font-size:12.5px;color:var(--muted)}
.batch{font-size:13.5px;color:var(--muted);text-align:center;margin:4px 0 18px}
ol.steps{padding:0;margin:10px 0 0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ol.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:18px;color:var(--herb)}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:14px}

/* shop */
.cookrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.cookrow:first-child{border-top:0}
.cookrow .t{font-size:15px;font-weight:700;line-height:1.3}
.cookrow .w{font-size:12.5px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:4px}
.mini button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.mini output{min-width:30px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-top:12px}
details.panel summary{padding:10px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.panel summary::-webkit-details-marker{display:none}
details.panel[open] summary{border-bottom:1px solid var(--line)}
.aisle{margin-top:22px}
.aisle h3{display:flex;justify-content:space-between;align-items:baseline}
.aisle h3 span{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--herb)}
.item .a{font-weight:700;font-size:15.5px;line-height:1.3}
.item .b{font-size:13px;color:var(--muted)}
.item .q{font-family:var(--display);font-weight:700;font-size:17px;text-align:right;white-space:nowrap}
.item .q small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.item.got .a,.item.got .q{text-decoration:line-through;opacity:.5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;min-height:44px;font-size:14px;font-weight:700}
.btn.primary{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}

/* progress */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 6px;margin-top:14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);padding:2px 6px 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.wrows{margin-top:6px}
.wrow{display:grid;grid-template-columns:1fr 104px 64px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .t{font-weight:700;font-size:15px}
.wrow .w{font-size:12.5px;color:var(--muted)}
.wrow input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-size:16px;text-align:right}
.wrow .delta{font-size:13.5px;text-align:right}
.grid8{display:grid;grid-template-columns:52px repeat(7,1fr);gap:5px;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.grid8 .cell{aspect-ratio:1;border-radius:6px;background:var(--sunk)}
.grid8 .cell.today{outline:2px solid var(--ink);outline-offset:1px}
.grid8 .hd{text-align:center}
.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px 0 12px}
.settings label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.settings input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px;font-size:16px;width:100%}
.syncnote{font-size:12.5px;color:var(--muted);margin-top:28px;text-align:center}
.swaps{width:100%;border-collapse:collapse;font-size:14px}
.swaps td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
.swaps td:first-child{font-weight:700;width:34%;padding-right:10px}
.tblwrap{overflow-x:auto}
@media (max-width:380px){ .scale .big{font-size:46px} .settings{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }

/* ---- v2: focus-first, ADHD-friendly additions ---- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.streak{font-family:var(--display);font-weight:700;font-size:14px;background:var(--herb-soft);color:var(--herb);border-radius:999px;padding:5px 12px;white-space:nowrap}
.focus{background:var(--ink);color:var(--paper);border-radius:22px;padding:18px 18px 16px;margin-bottom:16px}
.focus .lbl{font-size:14px;opacity:.75}
.focus .title{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;margin:4px 0 6px}
.focus .mac{color:inherit;opacity:.85}
.focus .mac .p,.focus .mac .c,.focus .mac .f{color:inherit}
.focus .acts{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
.bigbtn{border:0;border-radius:16px;padding:16px 18px;font-family:var(--display);font-weight:800;font-size:19px;background:var(--herb);color:var(--herb-ink);display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.ghost{border:1.5px solid color-mix(in srgb,var(--paper) 40%,transparent);background:transparent;color:var(--paper);border-radius:16px;padding:0 18px;font-weight:700;min-height:56px}
.focus.done{background:var(--herb);color:var(--herb-ink)}
.focus.done .title{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.jobs{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:16px}
.jobs h3{padding:12px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.jobs h3 span{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.job{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;font-size:15.5px;line-height:1.35}
.job input{width:24px;height:24px;margin:0;accent-color:var(--herb)}
.job.got span{text-decoration:line-through;opacity:.5}
.time{font-family:var(--display);font-weight:700;color:var(--muted);font-size:13px;margin-right:6px}
.fam{display:inline-block;font-size:12px;font-weight:700;color:var(--herb);background:var(--herb-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.secthead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:20;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{background:var(--paper);color:var(--ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.household{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0}
.household + .household{border-top:1px solid var(--line)}
.shopbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4;background:var(--paper);padding:10px 0 8px;margin-bottom:4px}
.shopbar .bar{height:12px}
.shopbar .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--herb)}
.cookbtn{width:100%;margin:6px 0 18px}
/* cooking mode */
.cookmode{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cm-top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);gap:12px}
.cm-top .t{font-family:var(--display);font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-body{flex:1;overflow:auto;padding:20px 18px;max-width:640px;width:100%;margin:0 auto}
.cm-count{font-family:var(--display);font-weight:700;color:var(--herb);font-size:16px}
.cm-dots{display:flex;gap:6px;margin:10px 0 18px}
.cm-dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.cm-dots i.on{background:var(--herb)}
.cm-step{font-family:var(--display);font-weight:700;font-size:clamp(24px,6.5vw,32px);line-height:1.25;letter-spacing:-0.01em}
.cm-step .q{color:var(--herb)}
.cm-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 18px;border-top:1px solid var(--line);max-width:640px;width:100%;margin:0 auto}
.cm-nav .prev{border:1px solid var(--line);background:var(--surface);border-radius:16px;font-weight:700;min-height:56px}
.timerbtn{margin-top:22px;border:2px solid var(--herb);color:var(--herb);background:transparent;border-radius:16px;padding:14px 18px;font-weight:700;font-size:17px;display:inline-flex;gap:8px;align-items:center}
.timerpill{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);z-index:40;background:var(--herb);color:var(--herb-ink);border:0;border-radius:999px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.timerpill.ring{background:var(--over);color:#fff;animation:pop .6s ease infinite alternate}
.gather .ing{cursor:pointer;grid-template-columns:30px 1fr auto}
.gather .ing input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--herb)}
.gather .ing.got .in1,.gather .ing.got .q{text-decoration:line-through;opacity:.5}
@media (prefers-reduced-motion:reduce){ .focus.done .title,.timerpill.ring{animation:none} }

.meal .nm::after{content:"";position:absolute;inset:0;border-radius:14px}
.bigbtn svg{flex-shrink:0}
details.panel summary span{transition:transform .2s;display:inline-block}
details.panel[open] summary span{transform:rotate(45deg)}
.settings{grid-template-columns:1fr 1fr}
/* quick log */
.qlog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px 14px;margin-bottom:16px}
.qlog h3{padding:12px 0 2px}
.qrow{padding:12px 0 2px;border-top:1px solid var(--line);margin-top:10px}
.qrow:first-of-type{border-top:0;margin-top:0}
.qlab{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;flex-direction:column;gap:1px}
.qlab span{font-weight:400;font-size:13px;color:var(--muted)}
.kgin{display:flex;align-items:center;gap:8px}
.kgin input{width:120px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:18px;text-align:right}
.chips.tight{margin:0}
.chips .chip{min-height:44px;padding:8px 14px}
/* deficit card */
.deficit{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dcell{background:var(--sunk);border-radius:12px;padding:10px 12px}
.dcell b{display:block;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.15}
.dcell span{font-size:12.5px;color:var(--muted)}
.verdict{border-left:4px solid var(--herb);padding:4px 0 4px 12px;font-size:15px}
.verdict.warn{border-color:var(--carbs)}
.verdict b{display:block;font-family:var(--display);font-size:17px}
.wavg{font-family:var(--display);font-weight:700;font-size:17px;text-align:right}
.wavg small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}

.eunit{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:transparent;border-radius:999px;min-height:44px;min-width:58px;padding:0 14px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.meter .val{min-width:118px}

.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.addrow input{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;min-height:48px;width:100%}
.havechips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip.have{background:var(--herb-soft);border-color:transparent;color:var(--ink);font-weight:700;display:inline-flex;gap:8px;align-items:center;min-height:44px}
.chip.have span{font-size:18px;line-height:1;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--herb);font-weight:700;font-size:14px;padding:10px 0;min-height:44px}
.pickgrp{padding:10px 0 6px}
.pickgrp h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
.mcard{margin-bottom:10px}
.mcard .rcard{margin:0}
.mcard .linkbtn{padding:6px 4px}
.w .ok{color:var(--herb)}
.needtag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--over);border:1px solid currentColor;border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:2px}
.aibox{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--herb);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none;border-top-color:var(--herb)} }
.item.xitem{grid-template-columns:32px 1fr auto 44px;cursor:default;align-items:center}
.item.xitem label{cursor:pointer}
.xrm{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--muted)}
.item.xitem.got label .a{text-decoration:line-through;opacity:.5}

.recap{background:var(--herb-soft);border-radius:20px;padding:16px 18px;margin-bottom:16px}
.recap .lbl{font-size:13px;color:var(--muted);font-weight:700}
.recap .rtitle{font-family:var(--display);font-weight:800;font-size:22px;margin:2px 0 8px}
.recap ul{margin:0 0 12px;padding-left:18px;font-size:15px;line-height:1.6}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;opacity:.7}
.badge .medal{grid-row:span 2;font-size:24px;color:var(--muted)}
.badge b{font-size:14.5px;line-height:1.2}
.badge span:last-child{font-size:12.5px;color:var(--muted)}
.badge.on{opacity:1;border-color:var(--herb);background:var(--herb-soft)}
.badge.on .medal{color:var(--carbs)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;border-radius:2px;animation:fly 1.5s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}55%{opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 95vh)) rotate(var(--r));opacity:0}}

.filters{margin:14px 0 4px}
.flabel{font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:1px 2px 4px;margin:0 -18px;padding-left:18px;padding-right:18px;scroll-padding-left:18px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{flex:0 0 auto;min-height:44px;white-space:nowrap}
.chip .cnt{font-size:12px;opacity:.7;margin-left:2px}
.fcount{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-top:6px;min-height:44px}
.findrow{margin-top:14px}
.findrow input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;min-height:48px}
.shopbar .chiprow{margin-bottom:8px}
</style>
</head>

function verdict(e){
  const hungry = e.hunger!==null && e.hunger>=2.6 && e.hungerN>=3;
  if(e.lossWk===undefined) return {warn:false, t:'Gathering data', b:'This needs about 2 weeks of weigh-ins and ticked meals. Daily weigh-ins on the Today tab make it more accurate.'};
  if(e.span<2.5 && e.lossWk>1.2) return {warn:false, t:'Early drop', b:'The first week or two is often water and gut content. The estimate settles from about week 3.'};
  if(e.pct>1.2 && hungry) return {warn:true, t:'Losing fast and hungry', b:`Your deficit looks bigger than it needs to be. Try adding about ${eS(150)} a day (for example, an extra 100g fruit and 2 rice cakes) and check with your coach.`};
  if(hungry) return {warn:true, t:'Hunger is high', b:`Try the hunger tips in Recipes first, such as moving the shake to after dinner. If you’re still hungry most days next week, talk to your coach about adding about ${eS(150)}.`};
  if(e.pct>1.2) return {warn:true, t:'Losing faster than planned', b:'More than 1% of body weight a week. Fine for a short shred if energy and training are holding up; keep an eye on both.'};
  if(e.lossWk<0.25 && e.span>=3) return {warn:true, t:'Loss has slowed', b:'Make sure ticks match what you ate and log any extras. If it’s still flat after 2 more weeks, talk to your coach about a small adjustment.'};
  return {warn:false, t:'On track', b:'Weight is moving at a sustainable rate without high hunger. Keep going.'};
}

/* ---------- status ---------- */
function dayStatus(w,d){
  const key=ymd(dateFor(w,d)); const meals=dayMeals(d); const c=state.checks[key]||{};
  const n=meals.filter(m=>c[m.key]).length; return {n, total:meals.length};
}
function streak(){
  const t=todayInfo(); if(t.diff<0) return 0;
  let i=Math.min(t.diff,55), s=0;
  const done = idx => { const w=Math.floor(idx/7)+1, d=idx%7, st=dayStatus(w,d); return st.n===st.total; };
  if(!done(i)) i--;
  while(i>=0 && done(i)){ s++; i--; }
  return s;
}

async function getIdeas(){

    const list = Array.isArray(res&&res.recipes) ? res.recipes : (Array.isArray(res)?res:[]);

  }
  if(ui.tab==='make' && !ui.idea) keepOpen(renderMake);
}

/* ---------- countdown, recap, badges ---------- */
function daysLeftText(t){ const left=55-t.diff; if(left<0||left>55) return ''; return left===0 ? '. Last day of the shred!' : `. ${left} ${left===1?'day':'days'} to go`; }
function weekMeals(w){ let n=0,tot=0; for(let d=0;d<7;d++){ const s=dayStatus(w,d); n+=s.n; tot+=s.total; } return {n,tot}; }
function weekAvgKg(w){ const p=weekPoints().find(p=>p.w===w); return p?p.kg:null; }
function weekHunger(w){ const h=[]; for(let d=0;d<7;d++){ const v=dayLog(ymd(dateFor(w,d))).hunger; if(v) h.push(v); } return h.length? h.reduce((a,b)=>a+b,0)/h.length : null; }
function recapCard(t){
  const w=t.week-1; if(w<1 || t.day>1 || state.recapSeen[w]) return '';
  const m=weekMeals(w), kg=weekAvgKg(w), prev = w===1 ? state.settings.startKg : weekAvgKg(w-1), h=weekHunger(w);
  const chg = (kg!==null && prev!==null) ? r1(kg-prev) : null;
  const lines=[`<li><b>${m.n} of ${m.tot}</b> meals ticked</li>`];
  if(chg!==null) lines.push(`<li><b>${chg<=0?'−':'+'}${Math.abs(chg)}kg</b> on the week before</li>`);
  if(h!==null) lines.push(`<li>Hunger mostly <b>${HUNGER[Math.round(h)-1].toLowerCase()}</b></li>`);
  const pct=m.tot? m.n/m.tot : 0;
  const head = pct>=0.9 ? 'Strong week.' : pct>=0.6 ? 'Solid week.' : 'New week, fresh start.';
  return `<div class="recap"><div class="lbl">Week ${w} recap</div><div class="rtitle">${head}</div><ul>${lines.join('')}</ul><button class="btn" data-act="recapok" data-v="${w}">Got it</button></div>`;
}
function badges(){
  const t=todayInfo(), S=state.settings; const out=[];
  let fullDay=false; for(let i=0;i<=Math.min(Math.max(t.diff,-1),55);i++){ const s=dayStatus(Math.floor(i/7)+1,i%7); if(s.n===s.total){ fullDay=true; break; } }
  let fullWeek=false; for(let w=1;w<=8;w++){ const m=weekMeals(w); if(m.n===m.tot){ fullWeek=true; break; } }
  const pts=weekPoints(), latest=pts[pts.length-1].kg, lost=S.startKg-latest;
  const loggedW = Object.keys(state.daily).filter(k=>state.daily[k].kg).length;
  out.push(['First full day', fullDay, 'Tick every meal in a day']);
  out.push(['Week streak', streak()>=7, '7 full days in a row']);
  out.push(['Perfect week', fullWeek, 'Every meal ticked Mon–Sun']);
  out.push(['Weigh-in habit', loggedW>=7, '7 morning weigh-ins']);
  out.push(['Halfway', t.diff>=28, 'Reach week 5']);
  out.push(['2kg down', lost>=2, 'Trend 2kg below start']);
  out.push(['5kg down', lost>=5, 'Trend 5kg below start']);
  out.push(['Shred complete', t.diff>=55, 'Finish all 8 weeks']);
  return out;
}

/* ---------- feedback ---------- */
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function buzz(ms){ try{ if(!reduceMotion() && navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function confetti(){
  if(reduceMotion()) return;
  const cols=['var(--herb)','var(--protein)','var(--carbs)','var(--fat)','var(--over)'];
  const box=document.createElement('div'); box.className='confetti'; box.setAttribute('aria-hidden','true');
  for(let i=0;i<70;i++){ const p=document.createElement('i'); const x=(Math.random()*2-1)*48, y=-(30+Math.random()*60), r=Math.random()*720-360;
    p.style.cssText=`left:50%;top:38%;background:${cols[i%cols.length]};--x:${x}vw;--y:${y}vh;--r:${r}deg;animation-delay:${Math.random()*0.15}s;width:${6+Math.random()*6}px;height:${8+Math.random()*8}px`; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),1800);
}

/* ---------- backup and restore ---------- */
async function downloadBackup(){
  const name=`shred-backup-${ymd(new Date())}.json`, data=JSON.stringify(state,null,1);
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename:name, data}); toast('Backup ready'); return; }
  }catch(e){ if(e && e.code && e.code!=='unavailable'){ return; } }
  try{ const url=URL.createObjectURL(new Blob([data],{type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Backup downloaded'); }
  catch(e){ copyText(data).then(ok=>toast(ok?'Couldn’t download, so the backup was copied instead':'Backup failed on this device')); }
}
function restoreFrom(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ toast('That file isn’t a Shred backup'); return; }
  if(!obj || typeof obj!=='object' || !obj.settings || !obj.checks){ toast('That file isn’t a Shred backup'); return; }
  const prev=state; state=merge(obj); ui.week=null; save(); render();
  toast('Backup restored', ()=>{ state=prev; ui.week=null; save(); render(); });
}
async function copyText(text){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}

/* ---------- toast with undo ---------- */
let toastTimer=null, undoFn=null;
function toast(msg, undo){
  undoFn=undo||null; clearTimeout(toastTimer);
  document.getElementById('toastbox').innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}</div>`;
  toastTimer=setTimeout(()=>{ document.getElementById('toastbox').innerHTML=''; undoFn=null; }, 5000);
}

/* ---------- cooking mode ---------- */
let cm=null, wakeLock=null;
function openCook(rec){ cm={rec, step:-1, got:{}}; requestWake(); drawCook(); }
function closeCook(){ cm=null; document.getElementById('overlay').innerHTML=''; document.body.style.overflow=''; if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; } }
async function requestWake(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function stepMinutes(text){ const m=text.match(/(\d+)(?:–(\d+))?\s*minutes?/); return m ? +(m[1]) : null; }
function drawCook(){
  const R=cm.rec, s=R.s, n=R.steps.length;
  document.body.style.overflow='hidden';
  let body='';
  if(cm.step<0){
    body = `<div class="cm-count">Before you start</div><div class="cm-dots">${'<i></i>'.repeat(n+1).replace('<i></i>','<i class="on"></i>')}</div>
      <div class="cm-step" style="font-size:24px;margin-bottom:14px">Get these out for ${fmtN(s)} ${serveWord(s)}</div><div class="ings gather">`;
    R.gather.forEach((qp,i)=>{ const on=!!cm.got[i];
      body += `<label class="ing ${on?'got':''}"><input type="checkbox" data-act="gather" data-v="${i}" ${on?'checked':''}><div><div class="in1">${esc(qp.name)}</div></div><div class="q num">${qp.main}${qp.sub?`<small>${qp.sub}</small>`:''}</div></label>`; });
    body += `</div>`;
  } else {
    const txt=R.steps[cm.step], mins=stepMinutes(txt);
    body = `<div class="cm-count">Step ${cm.step+1} of ${n}</div><div class="cm-dots">${Array.from({length:n+1},(_,i)=>`<i class="${i<=cm.step+1?'on':''}"></i>`).join('')}</div>
      <div class="cm-step">${esc(txt)}</div>
      ${mins?`<button class="timerbtn" data-act="timer" data-v="${mins}">${ICON_TIMER} Start ${mins}-minute timer</button>`:''}`;
  }
  const last = cm.step===n-1;
  document.getElementById('overlay').innerHTML = `<div class="cookmode" tabindex="-1" role="dialog" aria-modal="true" aria-label="Cooking ${esc(R.name)}">
    <div class="cm-top"><span class="t">${esc(R.name)}</span><button class="btn" data-act="cmclose">Close</button></div>
    <div class="cm-body">${body}</div>
    <div class="cm-nav"><button class="prev" data-act="cmprev" ${cm.step<0?'disabled':''}>Back</button><button class="bigbtn" data-act="${last?'cmclose':'cmnext'}">${cm.step<0?'Got everything':last?'Finished':'Next step'}</button></div></div>`;
  document.querySelector('.cookmode').focus(); document.querySelector('.cm-body').scrollTop=0;
}

/* ---------- timer ---------- */
let timer=null;
function startTimer(mins){
  clearInterval(timer?.iv);
  timer={end:Date.now()+mins*60000, mins};
  timer.iv=setInterval(drawTimer,500); drawTimer();
}
function drawTimer(){
  const box=document.getElementById('timerbox'); if(!timer){ box.innerHTML=''; return; }
  const left=Math.max(0,Math.round((timer.end-Date.now())/1000));
  if(left===0 && !timer.rang){ timer.rang=true; beep(); try{ navigator.vibrate && navigator.vibrate([300,150,300,150,300]); }catch(e){} }
  const mm=Math.floor(left/60), ss=String(left%60).padStart(2,'0');
  box.innerHTML = `<button class="timerpill num ${left===0?'ring':''}" data-act="timerstop" aria-label="${left===0?'Timer done, tap to dismiss':'Timer running, tap to cancel'}">${left===0?'Time’s up':mm+':'+ss}</button>`;
}
function beep(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t0=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.25,ac.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t0+0.3); o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+0.3); }); }catch(e){} }

/* ---------- events ---------- */
function toggleCheck(key, sub){ const c=state.checks[key]=state.checks[key]||{}; c[sub]?delete c[sub]:(c[sub]=1); save(); }
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.tagName==='INPUT') return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='tick'){
    const key=ymd(dateFor(ui.week,ui.day)); const was=!!(state.checks[key]||{})[v];
    toggleCheck(key,v); renderToday();
    const m=dayMeals(ui.day).find(x=>x.key===v);
    if(!was){ buzz(15); const st=dayStatus(ui.week,ui.day); if(st.n===st.total){ buzz([30,60,30]); confetti(); } }
    toast(`${m.slot} ${was?'unticked':'ticked'}`, ()=>{ toggleCheck(key,v); renderToday(); });
  }
  else if(a==='recapok'){ state.recapSeen[v]=1; save(); renderToday(); }
  else if(a==='backup'){ downloadBackup(); }
  else if(a==='restore'){ document.getElementById('restorefile').click(); }
  else if(a==='sharelist'){ shareList(); }
  else if(a==='rfilter'){ const k=b.dataset.k; ui.rf[k] = ui.rf[k]===v ? null : v; renderRecipes(); }
  else if(a==='rclear'){ ui.rf={meal:null,nut:null,prot:null}; renderRecipes(); }
  else if(a==='shopf'){ ui.shopF=v; const y=scrollY; renderShop(); scrollTo(0,y); }
  else if(a==='shopreset'){ ui.shopF='All'; ui.shopQ=''; keepOpen(renderShop); }
  else if(a==='undo'){ if(undoFn){ undoFn(); undoFn=null; } document.getElementById('toastbox').innerHTML=''; }
  else if(a==='day'){ ui.day=+v; renderToday(); }
  else if(a==='wk'){ ui.week=Math.min(8,Math.max(1,ui.week+(+v))); render(); }
  else if(a==='open'){ ui.fromTab=ui.tab; ui.recipe=v; ui.tab='recipes'; render(); scrollTo(0,0); }
  else if(a==='back'){ const f=ui.fromTab; ui.recipe=null; ui.fromTab=null; ui.tab=(f==='today'||f==='shop'||f==='make')?f:'recipes'; render(); scrollTo(0,0); }
  else if(a==='srv'){ state.now[ui.recipe]=Math.min(20,Math.max(0.5,nowServes(ui.recipe)+(+v))); save(); renderRecipes(); }
  else if(a==='srvset'){ state.now[ui.recipe]=+v; save(); renderRecipes(); }
  else if(a==='cookmode'){ openCook(planCookRec(ui.recipe)); }
  else if(a==='have'){ const i=state.pantry.indexOf(v); i>=0?state.pantry.splice(i,1):state.pantry.push(v); save(); keepOpen(renderMake); }
  else if(a==='unhave'){ state.pantry=state.pantry.filter(x=>x!==v); save(); keepOpen(renderMake); }
  else if(a==='haveclear'){ const prev=state.pantry; state.pantry=[]; save(); keepOpen(renderMake); toast('Ingredients cleared', ()=>{ state.pantry=prev; save(); keepOpen(renderMake); }); }
  else if(a==='addtyped'){ addTyped(); }
  else if(a==='mslot'){ state.settings.makeSlot=v; save(); keepOpen(renderMake); }
  else if(a==='aiget'){ getIdeas(); }
  else if(a==='aistop'){ ui.ai.ctl && ui.ai.ctl.abort(); }
  else if(a==='planmiss'){ const m=planMatches('Any').find(x=>x.id===v); const R=DATA.recipes[v], sv=nowServes(v); addToShop(m.miss.map(i=>{ const q=R.items.filter(x=>x[0]===i).reduce((t,x)=>t+x[1],0)*sv; return [DATA.ing[i].name, qtyParts(i,q,true).main]; })); }
  else if(a==='openidea'){ const it=findIdea(v); if(it){ ui.idea=it; render(); scrollTo(0,0); } }
  else if(a==='ideaback'){ ui.idea=null; render(); scrollTo(0,0); }
  else if(a==='isrv'){ state.now[ui.idea.id]=Math.min(20,Math.max(0.5,ideaServes(ui.idea)+(+v))); save(); render(); }
  else if(a==='isrvset'){ state.now[ui.idea.id]=+v; save(); render(); }
  else if(a==='ideacook'){ openCook(ideaCookRec(ui.idea)); }
  else if(a==='ideasave'){ const i=(state.saved||[]).findIndex(x=>x.id===ui.idea.id); if(i>=0){ const rm=state.saved.splice(i,1)[0]; toast('Removed from Recipes', ()=>{ state.saved.splice(i,0,rm); save(); render(); }); } else { state.saved=[ui.idea].concat(state.saved||[]).slice(0,30); toast('Saved to Recipes'); } save(); render(); }
  else if(a==='ideamiss'){ const s2=ideaServes(ui.idea); addToShop(ui.idea.ingredients.filter(g=>!g.have).map(g=>[g.name, amtParts(g,s2).main])); }
  else if(a==='xrm'){ const i=+v; const rm=state.extraShop.splice(i,1)[0]; save(); keepOpen(renderShop); toast('Removed', ()=>{ state.extraShop.splice(i,0,rm); save(); keepOpen(renderShop); }); }
  else if(a==='cmnext'){ cm.step++; drawCook(); }
  else if(a==='cmprev'){ cm.step=Math.max(-1,cm.step-1); drawCook(); }
  else if(a==='cmclose'){ closeCook(); }
  else if(a==='timer'){ startTimer(+v); }
  else if(a==='timerstop'){ clearInterval(timer?.iv); timer=null; drawTimer(); }
  else if(a==='hh'){ const k=b.dataset.k; state.settings[k]=Math.max(k==='adults'?1:0, Math.min(8,state.settings[k]+(+v))); save(); keepOpen(renderShop); }
  else if(a==='wkserve'){ const r=b.dataset.r; state.week[r]=Math.max(0,Math.min(40,weekServes(r)+(+v))); save(); keepOpen(renderShop); }
  else if(a==='wkreset'){ state.week={}; save(); keepOpen(renderShop); }
  else if(a==='shopclear'){ const prev=state.shop, prevX=state.extraShop.slice(); state.extraShop=state.extraShop.filter(x=>!state.shop['x:'+x.name]); state.shop={}; save(); keepOpen(renderShop); toast('Shopping ticks cleared', ()=>{ state.shop=prev; state.extraShop=prevX; save(); keepOpen(renderShop); }); }
  else if(a==='energy'){ state.settings.energy=v; save(); render(); }
  else if(a==='hunger'){ const key=ymd(dateFor(ui.week,ui.day)); setLog(key,{hunger: dayLog(key).hunger===+v ? undefined : +v}); renderToday(); }
  else if(a==='extra'){ const key=ymd(dateFor(ui.week,ui.day)); const ex=(dayLog(key).extras||[]).concat([+v]); setLog(key,{extras:ex}); renderToday(); toast(`+${b.dataset.l} logged`, ()=>{ const e2=(dayLog(key).extras||[]).slice(0,-1); setLog(key,{extras:e2}); renderToday(); }); }
  else if(a==='extraundo'){ const key=ymd(dateFor(ui.week,ui.day)); setLog(key,{extras:(dayLog(key).extras||[]).slice(0,-1)}); renderToday(); }
  else if(a==='goto'){ ui.week=+b.dataset.w; ui.day=+b.dataset.d; ui.tab='today'; render(); scrollTo(0,0); }
});
function keepOpen(fn){ const open=[...document.querySelectorAll('#v-'+ui.tab+' details')].map(d=>d.open); const y=scrollY; fn(); document.querySelectorAll('#v-'+ui.tab+' details').forEach((d,i)=>{ if(open[i]) d.open=true; }); scrollTo(0,y); }
document.addEventListener('change', e=>{
  const el=e.target, a=el.dataset.act, v=el.dataset.v; if(!a) return;
  if(a==='restorefile'){ const f=el.files&&el.files[0]; if(f){ f.text().then(restoreFrom); } el.value=''; return; }
  else if(a==='shopx'){ el.checked? state.shop['x:'+v]=1 : delete state.shop['x:'+v]; save(); keepOpen(renderShop); }
  else if(a==='shop'){ el.checked? state.shop[v]=1 : delete state.shop[v]; save(); setTimeout(()=>keepOpen(renderShop), state.settings.hideGot?250:0); }
  else if(a==='hidegot'){ state.settings.hideGot=el.checked; save(); keepOpen(renderShop); }
  else if(a==='job'){ toggleCheck(ymd(dateFor(ui.week,ui.day)),'job-'+v); renderToday(); }
  else if(a==='gather'){ cm.got[v]=el.checked; el.closest('.ing').classList.toggle('got',el.checked); }
  else if(a==='dkg'){ const n=parseFloat(el.value); setLog(ymd(dateFor(ui.week,ui.day)),{kg: (isNaN(n)||n<30||n>250)?undefined:r1(n)}); toast(isNaN(n)?'Weight cleared':'Weight saved'); }
  else if(a==='weight'){ const n=parseFloat(el.value); if(isNaN(n)) delete state.weights[v]; else state.weights[v]=r1(n); save(); keepOpen(renderProgress); }
  else if(a==='set'){ if(v==='start'){ if(el.value) state.settings.start=el.value; ui.week=null; } else { const n=parseFloat(el.value); if(!isNaN(n)) state.settings[v]=n; } save(); keepOpen(renderProgress); }
});
document.addEventListener('input', e=>{ if(e.target.id==='shopq'){ ui.shopQ=e.target.value; const l=document.getElementById('shoplist'); if(l) l.innerHTML=shopListHTML(); } });
document.addEventListener('keydown', e=>{ if(cm && e.key==='Escape') closeCook(); if(e.key==='Enter' && e.target.id==='typed'){ e.preventDefault(); addTyped(); } });
function addTyped(){ const inp=document.getElementById('typed'); if(!inp) return; const parts=inp.value.split(',').map(x=>x.trim()).filter(Boolean); if(!parts.length) return; parts.forEach(p=>{ const id=matchIng(p); const tok=id||('custom:'+p.slice(0,40).toLowerCase()); if(!state.pantry.includes(tok)) state.pantry.push(tok); }); save(); keepOpen(renderMake); const n=document.getElementById('typed'); n && n.focus(); }
document.addEventListener('visibilitychange', ()=>{ if(cm && document.visibilityState==='visible') requestWake(); });
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{
  ui.tab=b.dataset.tab; ui.recipe=null; ui.fromTab=null; ui.idea=null;
  if(ui.tab==='today'){ const t=todayInfo(); ui.week=t.week; ui.day=t.day; }
  render(); scrollTo(0,0);
}));
const h=location.hash.slice(1); if(['today','recipes','make','shop','progress'].includes(h)) ui.tab=h;
render();
connect();
initSample();
if('serviceWorker' in navigator && location.protocol==='https:' && !window.claude){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

</script>
</body>
